<!doctype html>
<html lang="en">
	<head>
		<link rel="stylesheet" href="style.css" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<div class="main">
			<div class="logo-section">
				<div class="logo-container">
					<div class="image">
						<img src="images/logo.jpg" alt="logo" />
					</div>
					<h1 class="logo-text">Sylvan</h1>
				</div>
			</div>

			<div class="hero">
				<div class="introduction">
					<p>
						This is not a real online service! You know you need
						life to help you realize your deepest dreams.Sign up to
						get started.
					</p>

					<p>You know what to do.</p>
				</div>

				<div class="form-section">
					<h2>Let's do this</h2>
					<form>
						<div class="form-left">
							<div>
								<label for="first-name"> First Name</label>
								<input type="text" required id="first-name" />
							</div>

							<div>
								<label for="email">Email</label>
								<input type="email" required id="email" />
							</div>

							<div>
								<label for="pw">Password</label>
								<input type="text" required id="pw" />
							</div>
						</div>

						<div class="form-right">
							<div>
								<label for="last-name">Last Name</label>
								<input type="text" required id="last-name" />
							</div>

							<div>
								<label for="phone-number">Phone Number</label>
								<input
									type="email"
									required
									id="phone-number"
								/>
							</div>

							<div>
								<label for="confirm-pw">Confirm Password</label>
								<input type="text" required id="confirm-pw" />
							</div>
						</div>
					</form>
				</div>
				<div class="buttons">
					<button>Create Account</button>
					<p>Already have an Account? log in</p>
				</div>
			</div>
		</div>
	</body>
</html>
